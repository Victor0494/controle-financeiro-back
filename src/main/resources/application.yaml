spring:
  datasource:
    url: jdbc:mysql://${MY_HOST}:3306/${MY_DATA_BASE}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
server:
  port: 8082

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: my-app
    distribution:
      percentiles-histogram:
        http.server.requests: true

jwt:
  public:
    key: file:key/app.pub
  private:
    key: file:key/private.key